# Log sin query string ($uri en lugar de $request_uri): los filtros nunca quedan en los logs.
log_format finanzas '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 1m;
  access_log /var/log/nginx/access.log finanzas;

  # DNS interno de Docker: si el contenedor api cambia de IP, nginx la vuelve a resolver.
  resolver 127.0.0.11 valid=10s ipv6=off;

  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  location /api/ {
    set $api_upstream http://finanzas-api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
  }

  # PWA (spec Fase 3 §6): el service worker, Workbox, el manifest y la página se revalidan siempre;
  # si faltan, 404 (nunca index.html en su lugar).
  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location ~ ^/workbox-[^/]+\.js$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    include /etc/nginx/snippets/security-headers.conf;
    types { application/manifest+json webmanifest; }
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
